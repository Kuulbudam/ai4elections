name: Database

# Applies supabase/migrations to the real Supabase project, then runs the live security check
# (Auth + Data API + Storage) against it. Runs when migrations change on main/phase-* branches, or manually.

on:
  push:
    # phase-* branches too, so migrations are proven on the real project before merge
    branches: [main, "phase-*"]
    paths: ["supabase/migrations/**", "services/api/scripts/**", "services/api/app/**", "data/synthetic/**", "tools/real_data/**"]
  workflow_dispatch:
    inputs:
      live_check:
        description: "Run the live security check after migrating"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check configuration
        id: cfg
        working-directory: .
        run: |
          [ -n "$DATABASE_URL" ] && echo "db=true" >> "$GITHUB_OUTPUT" || echo "db=false" >> "$GITHUB_OUTPUT"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "Supabase API secrets not set; live check skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Test-data cleanup (founder approved 20 Nov; ZZ CI / E2E test organisations only)
        run: python scripts/diag_size.py && exit 1
      - name: Apply pending migrations
        if: steps.cfg.outputs.db == 'true'
        run: python scripts/migrate.py
      - name: Live security check (real Auth, Data API, Storage)
        if: steps.cfg.outputs.db == 'true' && steps.cfg.outputs.api == 'true' && (github.event_name == 'push' || inputs.live_check)
        run: python scripts/live_isolation_check.py
      - name: Live ingestion check (real JWT, signed upload, storage, worker)
        if: steps.cfg.outputs.db == 'true' && steps.cfg.outputs.api == 'true' && (github.event_name == 'push' || inputs.live_check)
        run: python scripts/live_ingest_check.py
      - name: Live real-data check (CCIJ/VEZA Plateau 2023, downloaded at run time)
        if: steps.cfg.outputs.db == 'true' && steps.cfg.outputs.api == 'true' && (github.event_name == 'push' || inputs.live_check)
        run: python scripts/live_real_data_check.py
      - name: Live data assistant check (real model; skipped without LLM_API_KEY)
        if: steps.cfg.outputs.db == 'true' && steps.cfg.outputs.api == 'true' && (github.event_name == 'push' || inputs.live_check)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/live_assistant_check.py
      - name: Live result-sheet reader check (real vision model, Storage; skipped without LLM_API_KEY)
        if: steps.cfg.outputs.db == 'true' && steps.cfg.outputs.api == 'true' && (github.event_name == 'push' || inputs.live_check)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/live_sheet_check.py
