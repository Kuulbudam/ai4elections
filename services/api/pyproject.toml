[project]
name = "ai4elections-api"
version = "0.1.0"
description = "AI4Elections API and job worker"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from this file).
dependencies = [
  "fastapi==0.165.0",
  "starlette==1.10.0",
  "pydantic==2.12.4",
  "psycopg[binary]==3.2.12",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "pillow==13.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/contracts/models.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S608", "E501"]
"tests/**" = ["S", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
