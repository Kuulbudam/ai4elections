name: End-to-end (deployed)

# Phase 8 acceptance: Playwright drives the DEPLOYED site through the full workflow from a clean account
# (sign in, two-step set-up, organisation, project, upload, mapping, validation, analysis, areas, review,
# report, CSV download) with accessibility scans. Creates one fresh test account per run.
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Deployed web URL"
        default: "https://ai4elections-4d9a.vercel.app"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WEB_URL: ${{ inputs.web_url }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
