name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (lint, contract sync, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../../tools && ruff format --check . ../../tools
      - name: Contract sync (Pydantic models vs openapi.yaml)
        run: python scripts/gen_models.py --check
      - name: Tests (incl. job-ledger tests on real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q
      - name: Runtime dependency audit (known vulnerabilities, PyPI advisory database)
        run: python -m pip install pip-audit==2.9.0 && pip-audit -r requirements.txt --progress-spinner off

  migrations:
    name: Migrations apply cleanly from empty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "psycopg[binary]==3.2.12"
      - name: Supabase shim, then migrations via the real migration tool (twice = idempotent)
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_shim.sql
          DATABASE_URL="$PGURL" python services/api/scripts/migrate.py
          DATABASE_URL="$PGURL" python services/api/scripts/migrate.py | tee /tmp/second.txt
          grep -q "0 pending" /tmp/second.txt
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f services/api/spike/schema.sql
          echo "Tables without RLS (must be none):"
          test "$(psql "$PGURL" -Atc "select count(*) from pg_tables where schemaname='public' and not rowsecurity")" = "0"

  web:
    name: Web (contract sync, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Contract sync (TypeScript types vs openapi.yaml)
        run: npm run gen:types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
